<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How Aliens Travel</title>
  <style>
    body {
      margin: 0;
      background: #000;
    }

    main {
      display: grid;
      place-items: center;
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1rem;
    }

    video {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100vh - 2rem);
      max-height: calc(100dvh - 2rem);
    }
  </style>
</head>
<body>
  <main>
    <video width="1080" height="1920" controls playsinline preload="metadata"
      aria-label="How Aliens Travel">
      <source src="./assets/rinredbull.mp4" type="video/mp4">
      <a href="./assets/rinredbull.mp4">Open the video</a>
    </video>
  </main>
</body>
</html>
